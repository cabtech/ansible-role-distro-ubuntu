---
# --------------------------------

- name: 'Install packages'
  ansible.builtin.apt:
    pkg:
    - busybox-syslogd
    - finger
    - firehol
    - ipset
    - makepasswd
    - mysql-client
    - net-tools
    - pgpgpg
    - postgresql-client
    - python3
    - python3-apt
    - sysstat
    - sysvbanner
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'
  become: true
  tags:
  - ubuntu
  - ubuntu-pkg
  - x-pkg

- name: 'Install packages (~tor,~cloud)'
  ansible.builtin.apt:
    pkg: ['nfs-common', 'nfs-kernel-server']
    state: present
  when:
  - ansible_facts['distribution'] == 'Ubuntu'
  - not (ct_tor | bool)
  - ct_cloud is not defined
  become: true
  tags:
  - ubuntu
  - ubuntu-pkg
  - x-pkg

# --------------------------------

- name: 'Render script for refresh network after, for example, changing location'
  ansible.builtin.template:
    src: refresh_network.sh.j2
    dest: /usr/local/bin/refresh_network.sh
    owner: root
    group: root
    mode: '0775'
  become: true
  tags:
  - ubuntu
  - ubuntu-network
  - ubuntu-scripts

- name: 'Daily restart of NTP daemon'
  ansible.builtin.cron:
    user: root
    name: 'restart_ntp_service'
    minute: '0'
    hour: '3'
    job: '/etc/init.d/ntp restart'
  become: true
  tags:
  - ubuntu
  - ntp
  - ntp-cron
  - x-cron

# --------------------------------

- name: 'Tasks specific to a Ubuntu major release'
  ansible.builtin.include_tasks: ubuntu_{{ ansible_facts['distribution_major_version'] }}_only.yml
  tags:
  - ubuntu
  - always
  - bootstrap

- name: 'Changes introduced with Ubuntu 18'
  ansible.builtin.include_tasks: ubuntu_18_plus.yml
  when: ansible_facts['distribution_major_version'] | int >= 18
  tags:
  - ubuntu
  - always

- name: 'Changes introduced with Ubuntu 19'
  ansible.builtin.include_tasks: ubuntu_19_plus.yml
  when: ansible_facts['distribution_major_version'] | int >= 19
  tags:
  - ubuntu
  - always

