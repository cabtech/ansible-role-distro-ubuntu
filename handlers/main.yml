# --------------------------------

# do not call "&& netplan apply" after the generate as Ansible hangs
- name: HandlerNetplanUbuntu
  ansible.builtin.shell: netplan generate
  become: true
  tags: ["ubuntu", "skip_ansible_lint"]

- name: HandlerNetworkManagerConfig
  ansible.builtin.service:
    name: network-manager
    state: restarted
  become: true
  tags: ["ubuntu", "skip_ansible_lint"]

